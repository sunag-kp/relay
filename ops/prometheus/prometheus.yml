global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Every gateway replica is scraped on its own: Docker's DNS returns one A record per
  # replica, so scaling `gateway` up or down needs no config change.
  - job_name: gateway
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 8000
        refresh_interval: 5s
