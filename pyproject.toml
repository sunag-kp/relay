[project]
name = "relay"
version = "0.1.0"
description = "Self-hostable LLM gateway: one OpenAI-compatible endpoint with multi-provider routing, circuit breakers, Redis rate limits, exact + semantic caching and cost metering."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sunag KP" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
]

[project.optional-dependencies]
# Local sentence-embedding model for the semantic cache (ONNX, CPU). Without it the gateway
# falls back to the dependency-free hashing embedder.
local-embeddings = ["fastembed>=0.7"]

[project.scripts]
relay-gateway = "relay.api.main:run"
relay-mock-provider = "relay.mock_provider.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["ui"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "PL",
    "TID", "TC", "PERF", "LOG", "G",
]
ignore = [
    "PLR0913", # DI constructors legitimately take many collaborators
    "PLR0917", # ditto, for positional collaborators
    "PLR2004", # magic values are fine in thresholds and tests
    "N818",    # domain errors read better as nouns (RateLimited, ModelNotFound)
    "SIM905",  # word lists are more readable as a split string
    "S101",    # assert is used for type narrowing
    "TC001", "TC002", "TC003", # runtime imports needed by pydantic/FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PLR0915", "PLC0415"]
"migrations/**" = ["N999"]
"benchmarks/**" = ["S311", "T201"]
"scripts/**" = ["T201", "S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Security"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["relay"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker-compose infrastructure (Postgres + pgvector, Redis)",
]

[tool.coverage.run]
source = ["relay"]
branch = true
omit = ["src/relay/api/main.py", "src/relay/mock_provider/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "relay"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> domain"
type = "layers"
layers = [
    "relay.api",
    "relay.services",
    "relay.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (no framework or infrastructure imports)"
type = "forbidden"
source_modules = ["relay.domain"]
forbidden_modules = ["relay.infra", "relay.api", "relay.services", "fastapi", "starlette", "sqlalchemy", "redis", "httpx"]

[[tool.importlinter.contracts]]
name = "Services depend on ports, never on concrete infrastructure or the web framework"
type = "forbidden"
source_modules = ["relay.services"]
forbidden_modules = ["relay.infra", "relay.api", "fastapi", "starlette", "sqlalchemy", "redis", "httpx"]
