# Load balancer in front of the stateless gateway replicas (docker compose `deploy.replicas`).
worker_processes auto;
events {
  worker_connections 4096;
}

http {
  access_log off;
  # Docker's embedded DNS returns one A record per replica; `resolve` re-reads them so
  # scaling the gateway up or down does not need an nginx restart.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream gateway {
    zone gateway 64k;
    # LLM calls are long and uneven (a streamed answer can hold a connection for seconds),
    # so send each request to the replica with the fewest active connections.
    least_conn;
    server gateway:8000 resolve max_fails=2 fail_timeout=5s;
    keepalive 128;
  }

  server {
    listen 8080;
    client_max_body_size 4m;

    location / {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Server-sent events must reach the client token by token.
      proxy_buffering off;
      proxy_read_timeout 300s;
      # Retry idempotent failures (a replica restarting) on another replica.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
