# Local stack: `make up`. Three stateless gateway replicas behind nginx share one Redis and one
# Postgres, exactly like a horizontally scaled production deployment.
name: relay

x-gateway-env: &gateway-env
  APP_ENV: dev
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
  REDIS_URL: redis://redis:6379/0
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  RELAY_CONFIG_FILE: ${RELAY_CONFIG_FILE:-config/relay.yaml}
  MOCK_PROVIDER_URL: http://mock-provider:9000
  # A known key for local development; production keys are created through the admin API.
  DEMO_API_KEY: ${DEMO_API_KEY:-rk_local_dev_key}
  DEMO_RPM_LIMIT: ${DEMO_RPM_LIMIT:-600}
  DEMO_TPD_LIMIT: ${DEMO_TPD_LIMIT:-5000000}
  # hashing (default, no download) | fastembed (build with EXTRAS=local-embeddings) | openai
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1.0}
  DASHBOARD_PUBLIC: ${DASHBOARD_PUBLIC:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        EXTRAS: ${EXTRAS:-}
    image: relay-gateway:local
    command: ["alembic", "upgrade", "head"]
    environment: *gateway-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Three fake LLM providers in one process (see src/relay/mock_provider/app.py).
  mock-provider:
    image: relay-gateway:local
    command: ["relay-mock-provider"]
    environment:
      MOCK_WORKERS: ${MOCK_WORKERS:-2}
      MOCK_PROFILES: >-
        {"alpha": {"latency_ms": 40, "jitter_ms": 10},
         "beta": {"latency_ms": 80, "jitter_ms": 20},
         "claude": {"latency_ms": 60, "jitter_ms": 15}}
    ports: ["9000:9000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: relay-gateway:local
    environment: *gateway-env
    deploy:
      replicas: ${GATEWAY_REPLICAS:-3}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mock-provider: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    volumes: [./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["8080:8080"]
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- observability ---------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.0.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/relay.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
